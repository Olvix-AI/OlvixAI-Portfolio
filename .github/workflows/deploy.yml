name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are allowed to finish so a half-uploaded
# artifact is not published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Several Radix/React deps declare peer ranges that predate React 19, so a plain
      # `npm ci` fails. This matches how the project installs locally.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build static export
        # Pages serves this repo from /OlvixAI-Portfolio. To move to a custom domain,
        # clear this value and add a public/CNAME file containing the domain.
        env:
          NEXT_PUBLIC_BASE_PATH: /OlvixAI-Portfolio
        run: npm run build

      # Pages runs Jekyll by default, which silently drops any directory starting with an
      # underscore — including Next's _next/, i.e. all the CSS and JS. This disables it.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
